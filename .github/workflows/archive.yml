# Checks for a new Roblox version and saves it as a release. GitHub starts scheduled runs late or skips them
# when it's busy, so each run keeps asking every 2 minutes for 10 minutes, and runs are asked for hourly.
# "Run workflow" on the Actions tab starts one now.
name: Save new Roblox versions
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: archive
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: node archive.js --watch 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
