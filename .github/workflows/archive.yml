# Checks for a new Roblox version every 30 minutes on GitHub's servers and saves it as a release.
# GitHub may start a scheduled run a few minutes late. "Run workflow" on the Actions tab starts one now.
name: Save new Roblox versions
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: archive
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: node archive.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
